<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">President photo placeholder</title>
  <desc id="desc">Replace this file by saving the President photo as assets/images/president.jpg</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1028"/>
      <stop offset="100%" stop-color="#111836"/>
    </linearGradient>
  </defs>
  <rect width="720" height="900" fill="url(#bg)"/>
  <rect x="28" y="28" width="664" height="844" fill="none" stroke="#f0b429" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="360" cy="340" r="110" fill="#15203a" stroke="#f0b429" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="360" cy="300" r="48" fill="#6b7fa3" fill-opacity="0.55"/>
  <ellipse cx="360" cy="430" rx="78" ry="52" fill="#6b7fa3" fill-opacity="0.55"/>
  <text x="360" y="580" text-anchor="middle" fill="#f0b429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6">PRESIDENT</text>
  <text x="360" y="620" text-anchor="middle" fill="#c8d4e8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Add photo: assets/images/president.jpg</text>
</svg>
